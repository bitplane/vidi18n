services:
  redis:
    image: docker.io/library/redis:7-alpine
    volumes:
      - redis-data:/data

  nginx:
    image: docker.io/library/nginx:1-alpine
    volumes:
      - type: bind
        source: ./web/conf
        target: /etc/nginx/conf.d
        read_only: true
      - type: bind
        source: ./web/wwwroot
        target: /usr/share/nginx/html
        read_only: true
      - type: volume
        source: artifacts
        target: /usr/share/nginx/html/output
        read_only: true
    ports:
      - "8080:80"
    depends_on:
      - manager

  manager:
    build:
      context: ./python
      dockerfile: Containerfile
      args:
        SERVICE_NAME: manager
    environment:
      REDIS_HOST: redis
    ports:
      - "8081:8081"
    volumes:
      - artifacts:/tmp/vidi18n
    depends_on:
      - redis

  download:
    build:
      context: ./python
      dockerfile: Containerfile
      args:
        SERVICE_NAME: download
    environment:
      REDIS_HOST: redis
      MANAGER_API: "http://manager:8081"
    volumes:
      - artifacts:/tmp/vidi18n
    depends_on:
      - redis
      - manager

  transcribe:
    build:
      context: ./python
      dockerfile: Containerfile
      args:
        SERVICE_NAME: transcribe
        DEPENDENCY_GROUP: worker
    environment:
      REDIS_HOST: redis
      VIDI18N_PROCESSOR_MODE: "${VIDI18N_PROCESSOR_MODE:-deterministic}"
      VIDI18N_MODEL_ROOT: /models
    volumes:
      - artifacts:/tmp/vidi18n
      - models:/models
    depends_on:
      - redis
      - download

  translate:
    build:
      context: ./python
      dockerfile: Containerfile
      args:
        SERVICE_NAME: translate
        DEPENDENCY_GROUP: worker
    environment:
      REDIS_HOST: redis
      VIDI18N_PROCESSOR_MODE: "${VIDI18N_PROCESSOR_MODE:-deterministic}"
      VIDI18N_MODEL_ROOT: /models
      ARGOS_PACKAGES_DIR: /models/argos
    volumes:
      - artifacts:/tmp/vidi18n
      - models:/models
    depends_on:
      - redis
      - transcribe

  package:
    build:
      context: ./python
      dockerfile: Containerfile
      args:
        SERVICE_NAME: package
    environment:
      REDIS_HOST: redis
    volumes:
      - artifacts:/tmp/vidi18n
    depends_on:
      - redis
      - translate

  models:
    profiles: ["models"]
    build:
      context: ./python
      dockerfile: Containerfile
      args:
        SERVICE_NAME: models
        DEPENDENCY_GROUP: "transcribe,translate"
    command: ["python", "-m", "vidi18n.models", "bootstrap"]
    environment:
      VIDI18N_MODEL_ROOT: /models
      ARGOS_PACKAGES_DIR: /models/argos
    volumes:
      - models:/models

  fixture:
    profiles: ["test"]
    build:
      context: ./test/fixture
      dockerfile: Containerfile
    ports:
      - "8090:80"


volumes:
  artifacts:
  models:
  redis-data:

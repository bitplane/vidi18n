[project]
name = "vidi18n"
description = "Automatic, online video translation server"
version = "0.1.0"
authors = [
    { name = "Gareth Davidson", email = "gaz@bitplane.net" }
]

readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Libraries :: Python Modules",
]


dependencies = [
    "pydantic>=2.11,<3",
    "redis>=5,<7",
    "requests>=2.32,<3",
    "httpx>=0.27,<1"
]

[project.optional-dependencies]
dev = [
    "flake8",
    "pre-commit",
    "pytest",
    "pytest-cov",
    "coverage",
    "pydoc-markdown",
    "mkdocs",
    "mkdocs-material",
]

manager = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "python-multipart>=0.0.18,<1"
]

download = [
    "imageio-ffmpeg==0.4.8",
    "yt-dlp" # use latest version. also upgrade at runtime!
]

worker = []

transcribe = [
    "faster-whisper>=1.1,<2"
]

translate = [
    "argostranslate>=1.9,<2"
]


[build-system]
build-backend = "flit_core.buildapi"
requires = ["flit_core >=3.2,<4"]


[project.urls]
"Homepage" = "https://github.com/bitplane/vidi18n"
"Bug Tracker" = "https://github.com/bitplane/vidi18n"

server {
    listen 80;
    server_name localhost;

    location /api/ {
        proxy_pass http://manager:8081/;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    location / {
        root /usr/share/nginx/html;
        index index.html;
    }
}

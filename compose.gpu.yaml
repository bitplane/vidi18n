services:
  transcribe:
    build:
      dockerfile: Containerfile.cuda
      args:
        SERVICE_NAME: transcribe
        DEPENDENCY_GROUP: transcribe
    environment:
      VIDI18N_PROCESSOR_MODE: local
      VIDI18N_WHISPER_DEVICE: cuda
      VIDI18N_WHISPER_COMPUTE_TYPE: float16
    devices:
      - "nvidia.com/gpu=all"
    security_opt:
      - label=disable

  translate:
    build:
      args:
        SERVICE_NAME: translate
        DEPENDENCY_GROUP: translate
    environment:
      VIDI18N_PROCESSOR_MODE: local
